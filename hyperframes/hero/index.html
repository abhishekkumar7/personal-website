<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 720px; overflow: hidden; background: #0b1028; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      #glow { background:
        radial-gradient(900px 600px at 1450px 330px, rgba(84,104,255,.30), transparent 70%),
        radial-gradient(500px 400px at 1750px 650px, rgba(240,178,74,.12), transparent 70%); }
      canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 720px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="720">
      <div id="glow" class="layer clip" data-start="0" data-duration="12"></div>
      <canvas id="net" class="clip" width="1920" height="720" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      // Ambient network that loops exactly: every motion is periodic in T.
      let seed = 23;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const T = 12, TAU = Math.PI * 2;
      const N = 95;
      const nodes = [];
      for (let i = 0; i < N; i++) {
        // denser toward the right, where the portrait and light sit
        const u = Math.pow(rnd(), 0.6);
        nodes.push({
          x: 80 + u * 1820, y: 30 + rnd() * 660,
          ax: 14 + rnd() * 34, ay: 10 + rnd() * 26,
          k: 1 + Math.floor(rnd() * 2), ph: rnd() * TAU, ph2: rnd() * TAU,
          r: 2 + rnd() * 3.2, warm: rnd() < 0.12, tw: rnd() * TAU
        });
      }
      // packets that travel between fixed node pairs, 2 trips per loop each
      const PAIRS = [];
      for (let i = 0; i < 9; i++) PAIRS.push([Math.floor(rnd() * N), Math.floor(rnd() * N), rnd()]);

      const cv = document.getElementById("net");
      const ctx = cv.getContext("2d");
      function pos(n, t) {
        const a = (TAU * n.k * t) / T;
        return [n.x + Math.cos(a + n.ph) * n.ax, n.y + Math.sin(a + n.ph2) * n.ay];
      }
      function draw(t) {
        ctx.clearRect(0, 0, 1920, 720);
        const P = nodes.map((n) => pos(n, t));
        ctx.lineWidth = 1.2;
        for (let i = 0; i < N; i++) {
          for (let j = i + 1; j < N; j++) {
            const dx = P[i][0] - P[j][0], dy = P[i][1] - P[j][1];
            const d = Math.hypot(dx, dy);
            if (d < 175) {
              const fade = Math.min(1, P[i][0] / 1100);
              ctx.strokeStyle = `rgba(150,165,255,${(0.32 * (1 - d / 175) * fade).toFixed(3)})`;
              ctx.beginPath(); ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(P[j][0], P[j][1]); ctx.stroke();
            }
          }
        }
        nodes.forEach((n, i) => {
          const fade = 0.25 + 0.75 * Math.min(1, P[i][0] / 1100);
          const tw = 0.55 + 0.45 * Math.sin((TAU * 2 * t) / T + n.tw);
          ctx.fillStyle = n.warm ? `rgba(240,178,74,${(fade * tw).toFixed(3)})` : `rgba(190,200,255,${(fade * tw).toFixed(3)})`;
          ctx.beginPath(); ctx.arc(P[i][0], P[i][1], n.r, 0, TAU); ctx.fill();
        });
        PAIRS.forEach(([a, b, off]) => {
          const s = (((t / T) * 2 + off) % 1);
          const x = P[a][0] + (P[b][0] - P[a][0]) * s, y = P[a][1] + (P[b][1] - P[a][1]) * s;
          const alpha = Math.sin(Math.PI * s) * Math.min(1, x / 1100);
          ctx.fillStyle = `rgba(240,178,74,${alpha.toFixed(3)})`;
          ctx.beginPath(); ctx.arc(x, y, 3.5, 0, TAU); ctx.fill();
        });
      }

      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: T, duration: T, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      draw(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
